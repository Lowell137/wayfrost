<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="0.55" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#c0e0ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0b2a4a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded-square base -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#glass)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" ry="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- screen / document card -->
  <g filter="url(#soft)">
    <rect x="28" y="24" width="66" height="72" rx="9" ry="9" fill="#f6f9ff"/>
  </g>

  <!-- text lines -->
  <g fill="#8bb4e6">
    <rect x="37" y="35" width="48" height="6" rx="3"/>
    <rect x="37" y="47" width="48" height="6" rx="3"/>
    <rect x="37" y="71" width="34" height="6" rx="3"/>
    <rect x="37" y="83" width="42" height="6" rx="3"/>
  </g>

  <!-- highlighted / selected line being extracted -->
  <rect x="35" y="58" width="52" height="8.5" rx="4.25" fill="url(#sel)"/>
  <rect x="37" y="60.5" width="40" height="3.5" rx="1.75" fill="#1a5fb4"/>

  <!-- cursor grabbing the selection -->
  <g filter="url(#soft)">
    <path d="M78 60 L98 78 L88.5 79.2 L93.5 89.5 L89.6 91.4 L84.7 81.2 L77.5 87.5 Z"
          fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- frost sparkles -->
  <g fill="#ffffff">
    <path d="M104 30 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z" opacity="0.95"/>
    <path d="M20 92 l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z" opacity="0.8"/>
  </g>
</svg>

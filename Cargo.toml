[package]
name = "wayfrost"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
ashpd = "0.10"
image = "0.25"
ort = "2.0.0-rc.9"
wl-clipboard-rs = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
xdg = "2.5"
ndarray = "0.17"
